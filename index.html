      <div class="ops">${S.pagos.map(m=>`<button data-exc="${escH(m)}" class="${F.excluir.includes(m)?'on':''}">${escH(m)}</button>`).join('')}</div>
      <div class="g-t">Cliente inactivo después de</div>
      <input id="af-inac" class="num-in" type="number" min="3" max="120" value="${F.inactivo}">
      <div class="modal-acc"><button class="btn" id="af-no">Cancelar</button><button class="btn dark" id="af-ok">Guardar ajustes</button></div>`;
    const box=$('#modalBox');
    const leer=()=>{ F.meta=Math.max(2,parseInt($$('#af-meta').value)||8); F.premio=($$('#af-premio').value||'').trim()||'Premio';
      F.inactivo=Math.max(3,parseInt($$('#af-inac').value)||21); };
    box.querySelectorAll('[data-act]').forEach(b=> b.onclick=()=>{ leer(); F.activo=b.dataset.act==='1'; pinta(); });
    box.querySelectorAll('[data-modo]').forEach(b=> b.onclick=()=>{ leer(); F.modo=b.dataset.modo; pinta(); });
    box.querySelectorAll('[data-bv]').forEach(b=> b.onclick=()=>{ leer(); F.bienvenida=b.dataset.bv==='1'; pinta(); });
    box.querySelectorAll('[data-cup]').forEach(b=> b.onclick=()=>{ leer(); F.cupon=b.dataset.cup; pinta(); });
    box.querySelectorAll('[data-loc]').forEach(b=> b.onclick=()=>{ leer(); F.locales[b.dataset.loc]=!F.locales[b.dataset.loc]; pinta(); });
    box.querySelectorAll('[data-dia]').forEach(b=> b.onclick=()=>{ leer(); const k=b.dataset.dia;
      F.dobles=F.dobles.includes(k)?F.dobles.filter(x=>x!==k):[...F.dobles,k]; pinta(); });
    box.querySelectorAll('[data-exc]').forEach(b=> b.onclick=()=>{ leer(); const k=b.dataset.exc;
      F.excluir=F.excluir.includes(k)?F.excluir.filter(x=>x!==k):[...F.excluir,k]; pinta(); });
    $('#af-no').onclick=cerrarModal;
    $('#af-ok').onclick=async()=>{ leer(); S.fidel=F; aplicarBienvenidas(); await guardarYa(); cerrarModal(); renderClientes(); pintarPasaporte(); toast('Ajustes guardados'); };
  };
  pinta(); $('#modal').classList.add('on');
}

/* ================= cocina ================= */
const ESTADOS=[['pendiente','Pendiente'],['prep','En preparación'],['listo','Listo']];
const delDia=()=> S.pedidos.filter(p=>p.fecha===hoy()&&p.local===S.local&&!p.cerrado&&p.estado!=='anulado');
const anuladosDe=(f,l)=> S.pedidos.filter(p=>p.fecha===f&&p.local===l&&p.estado==='anulado');
function pintarBadge(){
  // Debe contar exactamente lo que se ve en la pantalla de cocina
  const n=delDia().filter(p=>['nuevo','pendiente','prep'].includes(p.estado)).length;
  $('#bdg').textContent=n; $('#bdg').style.display=n?'grid':'none';
}
const minutos=t=>Math.floor((Date.now()-t)/60000);
function tarjeta(p){
  const min=minutos(p.tiempos.enviado||p.creado);
  const tarde=min>=(p.promesa||15)&&p.estado!=='listo';
  const sig={pendiente:['prep','Empezar'],prep:['listo','Marcar listo'],listo:['entregado','Entregar']}[p.estado];
  const cls=p.estado==='pendiente'?'pend':p.estado==='prep'?'prep':'listo';
  const dest=p.modo==='delivery'?`<b>${p.cliente||'Cliente'}</b> · ${p.dir}${p.fono?' · '+p.fono:''}`
    :p.modo==='local'?`Mesa <b>${p.mesa||'—'}</b>`
    :`Para llevar · <b>${p.cliente||'Cliente'}</b>${p.fono?' · '+p.fono:''}`;
  return `<div class="card ${cls} ${tarde?'tarde':''}">
    <div class="c-top">
      <div style="display:flex;align-items:center;gap:9px"><span class="num">#${String(p.num).padStart(3,'0')}</span><span class="modo ${p.modo}">${p.modo}</span></div>
      <span class="crono ${tarde?'tarde':''}">${min} min${p.promesa?` / ${p.promesa}`:''}</span>
    </div>
    <div class="c-body">${p.items.map(i=>`<div class="l"><b>${i.q}×</b><span>${sinNumero(i.n)}</span></div>
      ${i.dcoc&&i.dcoc.length?`<div class="o" style="color:var(--brasa);font-weight:650">» ${i.dcoc.map(sinNumero).join(' · ')}</div>`:''}
      ${i.det&&i.det.length?`<div class="o">${i.det.map(sinNumero).join(' · ')}</div>`:''}
      ${i.nota?`<div class="o">📝 ${i.nota}</div>`:''}`).join('')}</div>
    <div class="c-meta">${dest}<br>${CLP(p.total)}${p.pago?' · '+p.pago:
      `<span style="color:var(--brasa);font-weight:800"> · sin cobrar</span>`} · ${hora(p.creado)}</div>
    <div class="c-acc">
      <button class="${p.estado==='listo'?'go':''}" data-a="next" data-id="${p.id}">${sig[1]}</button>
      <button class="sec" data-a="edit" data-id="${p.id}">✎</button>
      <button class="sec" data-a="boleta" data-id="${p.id}" title="Boleta">${
        (e=>e.clave==='emitida'?'✅':e.clave==='auto'?'🏧':'🧾')(estadoDoc(p))}</button>
      <button class="sec" data-a="print" data-id="${p.id}">🖨</button>
      <button class="sec" data-a="transf" data-id="${p.id}" title="Datos de transferencia">🏦</button>
      <button class="sec" data-a="anular" data-id="${p.id}" title="Anular">✕</button>
    </div></div>`;
}
function tarjetaNueva(p){
  const min=Math.floor((Date.now()-p.creado)/60000);
  return `<div class="card" style="border-left:4px solid var(--verde)">
    <div class="c-top">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="num">${p.numeroWeb||nPed(p)}</span>
        <span class="modo ${p.modo}">web · ${nombreModo(p.modo)}</span>
      </div>
      <span class="crono">${min} min</span>
    </div>
    <div class="c-body">${p.items.map(i=>`<div class="l"><b>${i.q}×</b><span>${i.n}</span></div>
      ${i.det&&i.det.length?`<div class="o">${i.det.join(' · ')}</div>`:''}`).join('')}</div>
    <div class="c-meta">${p.cliente||'Cliente'}${p.fono?' · '+p.fono:''}${p.dir?'<br>'+p.dir:''}
      <br><b>${CLP(p.total)}</b>${p.pago?' · '+p.pago:' · sin pagar'}
      ${p.notaWeb?`<br>📝 ${p.notaWeb}`:''}</div>
    <div class="c-acc"><button class="go" data-a="aceptar" data-id="${p.id}">Aceptar y dar tiempo</button></div>
  </div>`;
}
function renderCocina(){
  const ps=delDia();
  const nuevos=pedidosNuevos();
  const cajaNuevos = (cfgWeb().activo || nuevos.length) ? `
    <div class="panel" style="${nuevos.length?'border-color:var(--verde);box-shadow:0 0 0 2px rgba(63,125,58,.15)':''}">
      <h4 style="display:flex;align-items:center;gap:8px">Nuevos de la web
        ${nuevos.length?`<span class="c" style="background:var(--verde);color:#fff;border-radius:20px;padding:2px 8px">${nuevos.length}</span>`:''}
        <button class="btn" id="c-sync" style="margin-left:auto;padding:6px 12px;font-size:12.5px">Actualizar</button>
      </h4>
      ${nuevos.length
        ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">${nuevos.map(tarjetaNueva).join('')}</div>`
        : `<div style="color:var(--gris);font-size:13.5px">Nada pendiente por aceptar. ${ultimoWeb?'Última revisión '+hora(ultimoWeb):''} ${errorWeb?`<span style="color:var(--brasa)">· ${errorWeb}</span>`:''}</div>`}
    </div>` : '';
  $('#cols').insertAdjacentHTML('beforebegin','');
  const contNuevos=document.getElementById('cont-nuevos');
  if(contNuevos) contNuevos.innerHTML=cajaNuevos;
  $('#cols').innerHTML=ESTADOS.map(([e,t])=>{
    const l=ps.filter(p=>p.estado===e).sort((a,b)=>a.creado-b.creado);
    return `<div><div class="col-h">${t} <span class="c">${l.length}</span></div>
      <div class="col-body">${l.map(tarjeta).join('')||`<div class="col-vacia">Nada acá por ahora</div>`}</div></div>`;
  }).join('');
  const ent=ps.filter(p=>p.estado==='entregado').sort((a,b)=>b.creado-a.creado);
  $('#entregados').innerHTML=ent.length?`<div class="tabla-scroll"><table><tbody>${ent.map(p=>`<tr>
    <td style="font-family:var(--mono);font-weight:700">#${String(p.num).padStart(3,'0')}</td>
    <td>${p.modo}</td><td>${p.cliente||p.mesa||'—'}</td>
    <td class="mono">${hora(p.creado)}</td><td class="mono">${CLP(p.total)}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn" data-a="edit" data-id="${p.id}" style="padding:6px 10px">✎</button>
      <button class="btn" data-a="print" data-id="${p.id}" style="padding:6px 10px">🖨</button></td></tr>`).join('')}</tbody></table></div>`
    :`<div style="color:var(--gris);font-size:13.5px">Todavía no entregas ningún pedido hoy.</div>`;

  const an=anuladosDe(hoy(),S.local);
  $('#panelAnulados').innerHTML = an.length ? `<div class="panel">
    <h4>Anulados hoy · ${an.length}</h4>
    <div class="tabla-scroll"><table><tbody>${an.sort((a,b)=>b.creado-a.creado).map(p=>`<tr>
      <td style="font-family:var(--mono);font-weight:700;text-decoration:line-through">#${String(p.num).padStart(3,'0')}</td>
      <td>${p.cliente||p.mesa||'—'}</td>
      <td style="color:var(--brasa);font-size:12.5px">${p.anulacion?p.anulacion.motivo:''}</td>
      <td class="mono">${p.anulacion?hora(p.anulacion.ts):''}</td>
      <td class="mono" style="text-decoration:line-through">${CLP(p.total)}</td>
      <td style="text-align:right"><button class="btn" data-a="reactivar" data-id="${p.id}" style="padding:6px 10px">Reactivar</button></td>
    </tr>`).join('')}</tbody></table></div></div>` : '';
  // pedidos de días anteriores que nunca se cerraron
  const viejos=S.pedidos.filter(p=>p.local===S.local && p.fecha<hoy() && !p.cerrado
    && ['nuevo','pendiente','prep','listo'].includes(p.estado));
  $('#panelViejos').innerHTML = viejos.length ? `<div class="panel" style="border-color:var(--ambar)">
    <h4>Quedaron abiertos de días anteriores · ${viejos.length}</h4>
    <div style="font-size:12.5px;color:var(--gris);line-height:1.5;margin-bottom:10px">
      No aparecen en las columnas porque son de otra fecha. Ciérralos para que no queden dando vueltas.</div>
    <div class="tabla-scroll"><table><tbody>${viejos.sort((a,b)=>b.creado-a.creado).map(p=>`<tr>
      <td style="font-family:var(--mono);font-weight:700">#${String(p.num).padStart(3,'0')}</td>
      <td>${p.fecha.split('-').reverse().join('/')}</td>
      <td>${p.cliente||p.mesa||'—'}</td>
      <td>${p.estado}</td>
      <td class="mono">${CLP(p.total)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn" data-vent="${p.id}" style="padding:6px 10px">Entregado</button>
        <button class="btn danger" data-vanu="${p.id}" style="padding:6px 10px">Anular</button></td>
    </tr>`).join('')}</tbody></table></div></div>` : '';
  $('#panelViejos').querySelectorAll('[data-vent]').forEach(b=> b.onclick=async()=>{
    const p=S.pedidos.find(x=>x.id===b.dataset.vent); if(!p) return;
    if(!estaCobrado(p)) return cobrarPedido(p, async()=>{
      p.estado='entregado'; p.tiempos.entregado=Date.now();
      await guardarYa(); renderCocina(); pintarBadge();
    });
    p.estado='entregado'; p.tiempos.entregado=Date.now();
    await guardarYa(); renderCocina(); pintarBadge();
  });
  $('#panelViejos').querySelectorAll('[data-vanu]').forEach(b=> b.onclick=()=>{
    const p=S.pedidos.find(x=>x.id===b.dataset.vanu); if(p) anularPedido(p);
  });
  const bs=$('#c-sync'); if(bs) bs.onclick=()=>sincronizarWeb(false);
  document.querySelectorAll('#v-cocina [data-a]').forEach(b=> b.onclick=()=>{
    const p=S.pedidos.find(x=>x.id===b.dataset.id); if(!p) return;
    if(b.dataset.a==='aceptar') return aceptarWeb(p);
    if(b.dataset.a==='print') return pedirImpresion(p);
    if(b.dataset.a==='transf') return imprimir(p,'transferencia');
    if(b.dataset.a==='edit') return editarPedido(p);
    if(b.dataset.a==='boleta') return pedirBoleta(p);
    if(b.dataset.a==='anular') return anularPedido(p);
    if(b.dataset.a==='reactivar') return reactivarPedido(p);
    const orden={nuevo:'pendiente',pendiente:'prep',prep:'listo',listo:'entregado'};
    const siguiente=orden[p.estado];
    if(!siguiente) return;   // ya está entregado o anulado: no hay a dónde avanzar
    const avanzar=async()=>{
      p.estado=siguiente; p.tiempos[siguiente]=Date.now();
      if(siguiente==='listo') beep();
      await guardarYa(); renderCocina(); pintarBadge();
      if($('#v-caja').classList.contains('on')) renderCaja();
    };
    // No se cierra una venta sin registrar con qué pagaron
    if(siguiente==='entregado' && !estaCobrado(p)) return cobrarPedido(p, avanzar);
    avanzar();
  });
}


/* ================= editar un pedido ya enviado ================= */
function editarPedido(p){
  if(p.cerrado) return toast('Ese pedido está en una caja ya cerrada');
  const loc=S.locales[p.local];
  const e={modo:p.modo,cliente:p.cliente||'',fono:p.fono||'',dir:p.dir||'',mesa:p.mesa||'',
           pago:p.pago||'',pct:p.pct||0,codigo:p.codigo||'',zonaN:p.zona||'',propina:p.propina||0,
           propinaMedio:p.propinaMedio||'Efectivo',
           pagos:(p.pagos&&p.pagos.length)?JSON.parse(JSON.stringify(p.pagos)):(p.pago?[{medio:p.pago,monto:p.total}]:[]),
           items:JSON.parse(JSON.stringify(p.items))};
  const zonas=loc.zonas||[];
  if(e.modo==='delivery' && !e.zonaN && zonas.length) e.zonaN=zonas[0].n;
  const cats=[...new Set((loc.menu||[]).map(x=>x.cat))];
  let catAdd=cats[0]||'';

  const pagado = ()=> e.pagos.reduce((a,x)=>a+(Number(x.monto)||0),0);
  const falta = ()=> calc().total - pagado();
  function calc(){
    const sub=e.items.reduce((a,i)=>a+i.p*i.q,0);
    const z=zonas.find(x=>x.n===e.zonaN);
    const env=e.modo==='delivery' ? (z?z.p:(p.envio||0)) : 0;
    const desc=Math.round(sub*(e.pct||0)/100);
    return {sub,env,desc,total:sub-desc+env};
  }
  function guardarCampos(){
    const g=id=>$('#'+id)?$('#'+id).value:undefined;
    if(g('e-cli')!==undefined) e.cliente=g('e-cli');
    if(g('e-fono')!==undefined) e.fono=g('e-fono');
    if(g('e-dir')!==undefined) e.dir=g('e-dir');
    if(g('e-mesa')!==undefined) e.mesa=g('e-mesa');
    if(g('e-pct')!==undefined) e.pct=Math.max(0,Math.min(100,parseInt(g('e-pct'))||0));
    if(g('e-prop')!==undefined) e.propina=Math.max(0,parseInt(g('e-prop'))||0);
  }
  function pinta(){
    const t=calc();
    $('#modalBox').innerHTML=`
      <h4>Editar pedido ${nPed(p)}</h4>
      <div class="sb">Ingresado a las ${hora(p.creado)} · ${p.items.reduce((a,i)=>a+i.q,0)} producto(s)</div>

      <div class="g-t">Cobro ${e.pagos.length>1?`<span>${e.pagos.length} medios</span>`:''}</div>
      ${e.pagos.map((pg,ix)=>`<div class="cnt on">
          <span class="cn">${pg.medio}</span>
          <span class="cc"><input type="number" step="10" value="${pg.monto}" data-pmonto="${ix}"
            style="width:110px;border:1px solid var(--linea);border-radius:7px;padding:7px;text-align:right;background:#fff;font-family:var(--mono)">
            <button data-pdel="${ix}">✕</button></span>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:6px 0 8px">
        <span>Pagado ${CLP(pagado())}</span>
        <span style="color:${falta()===0?'var(--verde)':'var(--brasa)'}">
          ${falta()>0?'Falta '+CLP(falta()):(falta()<0?'Sobra '+CLP(-falta()):'Cuenta cubierta')}</span>
      </div>
      <div class="ops">${S.pagos.map(pg=>`<button data-padd="${pg}">+ ${pg}</button>`).join('')}</div>
      <div class="ops" style="margin-top:6px">
        <button data-pdiv="2">Dividir en 2</button>
        <button data-pdiv="3">En 3</button>
        <button data-pdiv="4">En 4</button>
        <button data-pclear="1">Limpiar</button>
      </div>

      <div class="g-t">Modalidad</div>
      <div class="ops">${MODOS.map(([k,ic,txt])=>`<button class="${e.modo===k?'on':''}" data-modo="${k}">${ic} ${txt}</button>`).join('')}</div>

      <div class="g-t">Datos</div>
      <div class="campos">
        ${e.modo==='local' ? `<input id="e-mesa" placeholder="Mesa" value="${e.mesa}">`
          : `<input id="e-cli" placeholder="Nombre del cliente" value="${e.cliente}">
             <input id="e-fono" placeholder="Teléfono" inputmode="tel" value="${e.fono}">
             ${e.modo==='delivery'?`<input id="e-dir" placeholder="Dirección" value="${e.dir}">
             <select id="e-zona">${zonas.map(z=>`<option ${e.zonaN===z.n?'selected':''}>${z.n} · ${CLP(z.p)}</option>`).join('')}</select>`:''}`}
      </div>

      <div class="g-t">Agregar producto</div>
      <select id="e-cat" style="width:100%;border:1px solid var(--linea);border-radius:8px;padding:9px;background:#fff;font-weight:650">
        ${cats.map(c=>`<option ${catAdd===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <div class="ops" style="margin-top:8px;max-height:150px;overflow:auto">
        ${loc.menu.filter(x=>x.cat===catAdd).map(x=>`<button data-add="${x.id}">${x.n} · ${
          Object.keys(x.precios).length>1 ? Object.entries(x.precios).map(([t,v])=>t+' '+CLP(v)).join(' / ') : CLP(Object.values(x.precios)[0])
        }</button>`).join('')}
      </div>

      <div class="g-t">Productos</div>
      ${e.items.map((i,ix)=>`<div class="cnt">
          <span class="cn">${i.n}${i.det&&i.det.length?`<br><span style="font-size:11.5px;color:var(--gris);font-weight:600">${i.det.join(' · ')}</span>`:''}</span>
          <span class="cc"><button data-it="-" data-ix="${ix}">−</button><b>${i.q}</b><button data-it="+" data-ix="${ix}">+</button>
            <button data-it="$" data-ix="${ix}" style="width:auto;padding:0 8px;font-size:12px">${CLP(i.p)}</button>
            <button data-it="x" data-ix="${ix}" style="width:auto;padding:0 8px;font-size:12px">Quitar</button></span>
        </div>`).join('') || `<div style="color:var(--gris);font-size:13.5px">Sin productos: el pedido se anulará.</div>`}

      <div class="g-t">Descuento ${e.codigo?`<span>${e.codigo}</span>`:''}</div>
      <input id="e-pct" class="num-in" type="number" min="0" max="100" step="1" value="${e.pct}" placeholder="% de descuento">

      <div class="g-t">Propina recibida <span>sugerida ${CLP(Math.round(calc().total*(S.impresora.propina||0)/100))}</span></div>
      <div class="ops" style="margin-bottom:7px">
        <button data-prop="0">Sin propina</button>
        <button data-prop="s">Sugerida ${S.impresora.propina||10}%</button>
      </div>
      <input id="e-prop" class="num-in" type="number" min="0" step="100" value="${e.propina}" placeholder="$ de propina">
      ${e.propina>0?`<div style="font-size:12px;color:var(--gris);font-weight:700;margin:9px 0 6px">Medio de la propina</div>
      <div class="ops">${S.pagos.map(m=>`<button class="${e.propinaMedio===m?'on':''}" data-emed="${m}">${m}</button>`).join('')}</div>`:''}

      <div class="t-tot" style="padding:12px 0 0;border-top:1px dashed var(--linea);margin-top:14px">
        <div class="r"><span>Subtotal</span><span>${CLP(t.sub)}</span></div>
        ${t.desc?`<div class="r" style="color:var(--verde)"><span>Descuento ${e.pct}%</span><span>−${CLP(t.desc)}</span></div>`:''}
        ${t.env?`<div class="r"><span>Delivery · ${e.zonaN}</span><span>${CLP(t.env)}</span></div>`:''}
        <div class="r big"><span>Total</span><span>${CLP(t.total)}</span></div>
        ${e.propina?`<div class="r" style="padding-top:6px"><span>Propina</span><span>${CLP(e.propina)}</span></div>
        <div class="r" style="font-weight:800"><span>Recibido</span><span>${CLP(t.total+e.propina)}</span></div>`:''}
      </div>

      <div class="modal-acc">
        <button class="btn" id="eCancel">Cancelar</button>
        <button class="btn" id="eOkPrint">Guardar e imprimir</button>
        <button class="btn dark" id="eOk">Guardar cambios</button>
      </div>`;

    const box=$('#modalBox');
    box.querySelectorAll('[data-padd]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const resto=Math.max(0, calc().total - pagado());
      e.pagos.push({medio:b.dataset.padd, monto:resto});
      pinta();
    });
    box.querySelectorAll('[data-pmonto]').forEach(inp=> inp.onchange=()=>{
      e.pagos[+inp.dataset.pmonto].monto=Math.max(0,Number(inp.value)||0); guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-pdel]').forEach(b=> b.onclick=()=>{ guardarCampos(); e.pagos.splice(+b.dataset.pdel,1); pinta(); });
    box.querySelectorAll('[data-pclear]').forEach(b=> b.onclick=()=>{ guardarCampos(); e.pagos=[]; pinta(); });
    box.querySelectorAll('[data-pdiv]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const n=+b.dataset.pdiv, t=calc().total;
      const base=Math.floor(t/n/10)*10;
      e.pagos=Array.from({length:n},(_,i)=>({medio:e.pagos[i]?e.pagos[i].medio:'Efectivo',
        monto: i===n-1 ? t-base*(n-1) : base}));
      pinta();
    });
    box.querySelectorAll('[data-modo]').forEach(b=> b.onclick=()=>{
      guardarCampos(); e.modo=b.dataset.modo;
      if(e.modo==='delivery' && !e.zonaN && zonas.length) e.zonaN=zonas[0].n;
      pinta();
    });
    box.querySelectorAll('[data-it]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const ix=+b.dataset.ix, a=b.dataset.it;
      if(a==='+') e.items[ix].q++;
      else if(a==='-'){ e.items[ix].q--; if(e.items[ix].q<=0) e.items.splice(ix,1); }
      else if(a==='$'){
        const it=e.items[ix];
        const v=prompt('Precio de "'+it.n+'" en este pedido:', it.p);
        if(v!==null){ const n=Math.max(0,parseInt(v)||0);
          if(n<it.p){
            pedirPin('Estás bajando "'+it.n+'" de '+CLP(it.p)+' a '+CLP(n)+'.').then(ok=>{
              if(!ok) return pinta();
              anotar('Precio rebajado', nPed(p)+' · '+it.n+': '+CLP(it.p)+' → '+CLP(n), it.p-n);
              it.det=(it.det||[]).filter(x=>!x.startsWith('Ingredientes extra'));
              it.p=n; pinta();
            });
            return;
          }
          if(n>it.p){
            it.det=(it.det||[]).filter(x=>!x.startsWith('Ingredientes extra'));
            it.det.push('Ingredientes extra (+'+CLP(n-it.p)+')');
            it.p=n;
          }
        }
        pinta(); return;
      }
      else e.items.splice(ix,1);
      pinta();
    });
    const ec=$('#e-cat'); if(ec) ec.onchange=()=>{ guardarCampos(); catAdd=ec.value; pinta(); };
    box.querySelectorAll('[data-add]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const prod=loc.menu.find(x=>x.id===b.dataset.add); if(!prod) return;
      const necesita = Object.keys(prod.precios).length>1 || (prod.mods||[]).length || (prod.elige||[]).length;
      if(necesita){
        const volver=()=>{ pinta(); $('#modal').classList.add('on'); };
        abrirConfig(prod, null, linea=>{ e.items.push(linea); volver(); }, volver);
      } else {
        const ya=e.items.find(i=>i.n===prod.n && (!i.det||!i.det.length) && !i.nota);
        if(ya) ya.q++; else e.items.push({n:prod.n,p:prod.precios.U,q:1,det:[],nota:''});
        pinta();
      }
    });
    const zn=$('#e-zona'); if(zn) zn.onchange=()=>{ guardarCampos(); e.zonaN=zn.value.split(' · ')[0]; pinta(); };
    const pc=$('#e-pct'); if(pc) pc.onchange=()=>{ guardarCampos(); pinta(); };
    const pr=$('#e-prop'); if(pr) pr.onchange=()=>{ guardarCampos(); pinta(); };
    box.querySelectorAll('[data-emed]').forEach(b=> b.onclick=()=>{ guardarCampos(); e.propinaMedio=b.dataset.emed; pinta(); });
    box.querySelectorAll('[data-prop]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      e.propina = b.dataset.prop==='0' ? 0 : Math.round(calc().total*(S.impresora.propina||10)/100);
      pinta();
    });
    $('#eCancel').onclick=cerrarModal;
    if($('#eOkPrint')) $('#eOkPrint').onclick=()=>aplicar(true);
    $('#eOk').onclick=()=>aplicar(false);
    async function aplicar(imprimirTambien){
      guardarCampos();
      const t0=p.total||0, t2p=calc().total;
      const efAntes=(p.pagos&&p.pagos.length?p.pagos:(p.pago?[{medio:p.pago,monto:p.total}]:[]))
        .filter(x=>/efectivo/i.test(x.medio)).reduce((a,x)=>a+(Number(x.monto)||0),0);
      const efDespues=e.pagos.filter(x=>/efectivo/i.test(x.medio)).reduce((a,x)=>a+(Number(x.monto)||0),0);
      if(t2p<t0-1){
        const ok=await pedirPin('El pedido baja de '+CLP(t0)+' a '+CLP(t2p)+'.');
        if(!ok) return;
        anotar('Pedido rebajado', nPed(p)+': '+CLP(t0)+' → '+CLP(t2p), t0-t2p);
      }
      if(efDespues<efAntes-1){
        const ok=await pedirPin('El efectivo de este pedido baja de '+CLP(efAntes)+' a '+CLP(efDespues)+'.');
        if(!ok) return;
        anotar('Efectivo cambiado', nPed(p)+': '+CLP(efAntes)+' → '+CLP(efDespues)+' ('+(e.pago||'sin medio')+')', efAntes-efDespues);
      }
      if((e.pct||0)>(p.pct||0)) anotar('Descuento aplicado', nPed(p)+': '+e.pct+'%', Math.round(calc().sub*(e.pct||0)/100));
      if(!e.items.length){
        cerrarModal();
        toast('Un pedido sin productos se anula con el botón ✕, para que quede el motivo');
        return anularPedido(p);
      } else {
        const t2=calc();
        Object.assign(p,{modo:e.modo,cliente:e.cliente.trim(),fono:e.fono.trim(),dir:e.dir.trim(),mesa:e.mesa.trim(),
          pagos:e.pagos.filter(x=>Number(x.monto)>0),
          pago:e.pagos.filter(x=>Number(x.monto)>0).map(x=>x.medio).join(' + '),
          pct:e.pct,desc:t2.desc,envio:t2.env,subtotal:t2.sub,total:t2.total,propina:e.propina||0, propinaMedio:e.propina>0?(e.propinaMedio||'Efectivo'):'',
          zona:e.modo==='delivery'?e.zonaN:'',items:e.items,editado:Date.now()});
      }
      await guardarYa(); cerrarModal();
      renderCocina(); pintarBadge();
      if($('#v-caja').classList.contains('on')) renderCaja();
      toast('Pedido actualizado');
      if(imprimirTambien && S.pedidos.some(x=>x.id===p.id)) setTimeout(()=>imprimir(p,'ambas'),200);
    }
  }
  pinta();
  $('#modal').classList.add('on');
}

const fraseDelPedido = p => {
  const lista=(S.frases&&S.frases.length)?S.frases:FRASES;
  // fija por pedido: si se reimprime, sale la misma
  const semilla = String(p.id||p.num||Date.now()).split('')

  return lista[semilla % lista.length];
};

/* ================= BOLETA ELECTRÓNICA ================= */
// Un pedido puede estar cubierto por el medio de pago (Getnet, apps) o necesitar boleta nuestra.
const emiteSolo = m => (S.pagosConBoleta||[]).some(x=> x.toLowerCase()===String(m||'').toLowerCase());
function estadoDoc(p){
  if(p.boleta && p.boleta.folio) return {clave:'emitida', txt:'Boleta N° '+p.boleta.folio, color:'var(--verde)'};
  const partes=(p.pagos&&p.pagos.length)?p.pagos:(p.pago?[{medio:p.pago,monto:p.total}]:[]);
  if(!partes.length) return {clave:'sinpago', txt:'sin registrar pago', color:'var(--gris)'};
  const cubiertos=partes.filter(x=>emiteSolo(x.medio)).reduce((a,x)=>a+(Number(x.monto)||0),0);
  const falta=partes.filter(x=>!emiteSolo(x.medio)).reduce((a,x)=>a+(Number(x.monto)||0),0);
  if(falta<=0) return {clave:'auto', txt:'la boleta la emite '+partes[0].medio, color:'var(--gris)'};
  if(cubiertos>0) return {clave:'parcial', txt:'falta boletear '+CLP(falta), color:'var(--brasa)', monto:falta};
  return {clave:'pendiente', txt:'sin boleta', color:'var(--brasa)', monto:falta};
}
async function emitirBoleta(p, rut, nombre){
  const w=cfgWeb();
  if(!w.url || !w.clave) { toast('Falta configurar el conector en Menú'); return null; }
  if(p.boleta && p.boleta.folio){ toast('Este pedido ya tiene boleta N° '+p.boleta.folio); return p.boleta; }
  toast('Emitiendo boleta…');
  try{
    const r=await fetch(w.url.replace(/\/$/,'')+'/boleta',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({clave:w.clave, pedidoId:p.id,
        items:p.items.map(i=>({n:i.n,q:i.q,p:i.p})),
        envio:p.envio||0, descuento:p.desc||0,
        rutCliente:rut||'', nombreCliente:nombre||p.cliente||''})});
    const d=await r.json();
    if(!r.ok || d.error){ toast('No se emitió: '+(d.error||r.status)); return null; }
    p.boleta={folio:d.folio, dte:d.tipo, total:d.total, fecha:d.fecha, pdf:d.pdf||'', pdf64:d.pdfBase64||''};
    await guardarYa();
    toast('Boleta N° '+d.folio+' emitida');
    renderCocina(); if($('#v-caja').classList.contains('on')) renderCaja();
    return p.boleta;
  }catch(e){ toast('No se pudo conectar para emitir la boleta'); return null; }
}
function abrirPdfBoleta(p){
  const b=p.boleta||{};
  if(b.pdf) return window.open(b.pdf,'_blank');
  if(b.pdf64){
    const bin=atob(b.pdf64), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const u=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
    window.open(u,'_blank'); return;
  }
  toast('Esta boleta no tiene PDF guardado');
}

  const ed=estadoDoc(p);

      Este pedido se pagó con un medio que emite la boleta por su cuenta. Si igual la emites acá, quedaría duplicada ante el SII.</div>`:''}
    ${p.boleta&&p.boleta.folio?`<div class="panel" style="margin:0 0 14px">
      <div style="font-weight:800;font-size:15px">Boleta N° ${p.boleta.folio}</div>
      <div style="font-size:12.5px;color:var(--gris);margin-top:3px">${p.boleta.fecha||''}</div>

    </div>`:`

    <input id="b-nom" class="num-in" placeholder="Nombre (si pusiste RUT)" style="margin-top:8px" value="${p.cliente||''}">
    <div style="font-size:12px;color:var(--gris);margin-top:10px;line-height:1.5">
      Sin RUT sale como boleta no nominativa, que es lo normal en el mostrador.
      Los precios ya incluyen IVA: el desglose lo calcula el SII.</div>
    <button class="btn ${ed.clave==='auto'?'':'dark'}" id="b-go" style="width:100%;margin-top:14px;padding:15px">
      ${ed.clave==='parcial'?'Emitir por '+CLP(ed.monto):'Emitir boleta'}</button>`}
    <div class="modal-acc"><button class="btn" id="b-cerrar">Cerrar</button></div>`;
  $('#b-cerrar').onclick=cerrarModal;
  if($('#b-pdf')) $('#b-pdf').onclick=()=>abrirPdfBoleta(p);
  if($('#b-go')) $('#b-go').onclick=async()=>{
    if(ed.clave==='auto' && !confirm('Este pedido ya lleva boleta del medio de pago.\n¿Emitir otra igual?')) return;
    const rut=($('#b-rut').value||'').trim(), nom=($('#b-nom').value||'').trim();
    cerrarModal();
    const b=await emitirBoleta(p,rut,nom);
    if(b && confirm('Boleta N° '+b.folio+' emitida.\n¿Abrir el PDF para imprimirla?')) abrirPdfBoleta(p);
  };
  $('#modal').classList.add('on');
}

let fechaCaja = null; // null = hoy
const fechaVista = () => fechaCaja || hoy();
function moverFecha(dias){
  const [a,m,d]=fechaVista().split('-').map(Number);
  const f=new Date(a,m-1,d+dias);
  fechaCaja = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
  renderCaja();
}
function fechaLarga(k){
  const [a,m,d]=k.split('-').map(Number);
  return new Date(a,m-1,d).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
}
function resumenDia(fecha, local){
  const ps=S.pedidos.filter(p=>p.fecha===fecha && p.local===local);
  const v=ps.filter(p=>p.estado==='entregado');   // los anulados nunca entran acá
  const productos=v.reduce((a,p)=>a+(p.subtotal||0)-(p.desc||0),0);
  const envios=v.reduce((a,p)=>a+(p.envio||0),0);
  const propinas=v.reduce((a,p)=>a+(p.propina||0),0);
  // Las propinas no son ingreso del local: van aparte y NO suman al recaudado.
  return {ps,v,productos,envios,propinas,total:productos+envios,recaudado:productos+envios};
}

function exportar(ps, etiqueta){
  const filas=[['N','Fecha','Hora','Local','Modalidad','Cliente','Mesa','Direccion','Telefono','Zona','Detalle','Subtotal','Descuento','Delivery','Propina','Total','Pago','Estado','Motivo anulacion','Boleta']];
  ps.forEach(p=>filas.push([p.num,p.fecha,hora(p.creado),S.locales[p.local].nombre,p.modo,p.cliente,p.mesa,p.dir,p.fono,p.zona||'',
    p.items.map(i=>`${i.q}x ${i.n}${i.det&&i.det.length?' ('+i.det.join(', ')+')':''}`).join(' | '),
    p.subtotal,p.desc,p.envio,p.propina||0,p.total,
    (p.pagos&&p.pagos.length)?p.pagos.map(x=>`${x.medio}: ${x.monto}`).join(' | '):(p.pago||''),p.estado,
    p.anulacion?p.anulacion.motivo:'', p.boleta&&p.boleta.folio?p.boleta.folio:'']));
  const csv=filas.map(f=>f.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`ventas-${S.local}-${etiqueta||hoy()}.csv`; a.click(); toast('CSV descargado');
}


/* ================= CUADRE (planilla de cierre) ================= */
// Junaeb va dentro de Local: se muestra aparte como referencia y NO se suma al total.
const COBROS=[['efectivo','Efectivo'],['transferencias','Transferencias'],['getnet','Débito/Crédito Getnet'],
              ['junaeb','Junaeb'],['pyonline','Pedidos Ya'],['uber','Uber Eats'],['rappi','Rappi']];
const claveCuadre = f => S.local+'|'+f;

function cuadreVacio(){
  return {fondo:0,efectivoContado:null,propinaPagada:undefined,apps:{},gastos:[],nota:''};
}
function getCuadre(f){
  const k=claveCuadre(f);
  if(!S.cuadres[k]) S.cuadres[k]=cuadreVacio();
  const c=S.cuadres[k];
  if(!c.gastos) c.gastos=[];
  if(!c.apps) c.apps={};
  return c;
}
// Lo que el sistema registró ese día, mapeado a los casilleros de la planilla
function delSistema(f){
  const v=S.pedidos.filter(p=>p.fecha===f&&p.local===S.local&&p.estado==='entregado');
  const cobros={};
  let repartos=0, propinas=0, propinasEfectivo=0;
  const porMedioProp={};
  v.forEach(p=>{
    repartos+=p.envio||0; propinas+=p.propina||0;
    if(p.propina>0){
      const pm=p.propinaMedio||'Efectivo';
      porMedioProp[pm]=(porMedioProp[pm]||0)+p.propina;
      if(/efectivo/i.test(pm)) propinasEfectivo+=p.propina;
    }
    // el pedido puede estar pagado con varios medios a la vez
    const partes=(p.pagos&&p.pagos.length)?p.pagos:[{medio:p.pago||'',monto:p.total}];
    partes.forEach(pt=>{
      const m=(pt.medio||'').toLowerCase(), monto=Number(pt.monto)||0;
      if(m.includes('efectivo')) cobros.efectivo=(cobros.efectivo||0)+monto;
      else if(m.includes('transfer')) cobros.transferencias=(cobros.transferencias||0)+monto;
      else if(m.includes('getnet')||m.includes('débito')||m.includes('debito')||m.includes('crédito')||m.includes('credito')) cobros.getnet=(cobros.getnet||0)+monto;
      else if(m.includes('junaeb')) cobros.junaeb=(cobros.junaeb||0)+monto;
      else if(m.includes('pedidos')) cobros.pyonline=(cobros.pyonline||0)+monto;
      else if(m.includes('uber')) cobros.uber=(cobros.uber||0)+monto;
      else if(m.includes('rappi')) cobros.rappi=(cobros.rappi||0)+monto;
    });
  });
  return {cobros,repartos,propinas,propinasEfectivo,porMedioProp,pedidos:v.length};
}

    (D.anulados||[]).forEach(a=> b.push({t:'row',l:'Anulado '+a.n+' '+a.motivo,r:CLP(a.m),size:f*0.8}));
    (D.movimientos||[]).forEach(m=> b.push({t:'row',l:m.a+': '+m.d,r:m.m?CLP(m.m):'',size:f*0.8}));
  }
  if(D.nota){ b.push({t:'gap'}); b.push({t:'txt',s:D.nota,size:f*0.85}); }
  b.push({t:'gap'});
  b.push({t:'row',l:'Firma',r:'____________',size:f*0.9});
  b.push({t:'txt',s:'Impreso '+new Date().toLocaleString('es-CL'),align:'center',size:f*0.7});
  return b;
}
async function imprimirCuadre(datos){
  const im=S.impresora;
  logoListo = (S.locales[S.local]?.logoBN && im.logo!==false) ? await cargarImg(S.locales[S.local].logoBN) : null;
  estiloImpresion();
  const bl=bloquesCuadre(datos);
  const cuerpo = im.modo==='texto' ? htmlCupon(bl,'boleta') : `<img src="${pintarCupon(bl, fuenteDe('boleta'))}">`;
  const cont=$('#print');
  cont.innerHTML = `<div class="cupon">${cuerpo}</div>`;
  const imgs=[...cont.querySelectorAll('img')];
  await Promise.all(imgs.map(el=> el.complete?Promise.resolve()
    : new Promise(r=>{ el.onload=r; el.onerror=r; setTimeout(r,1500); })));
  try{ window.print(); }catch(e){ toast('No se pudo abrir la impresión'); }
}

  const propinaSis = sis.propinas;

  // el resto se paga en efectivo hasta donde alcance.
  const disponibleTotal = fondo + efectivoSis - gastos + propinaEfectivoSis;  // todo lo que hay físicamente
  const aPagar = c.propinaPagada===undefined ? propinaSis : num(c.propinaPagada);

      ...APPS.map(([k,l])=>[l,num(c.apps[k])]),['Total apps',totalApps],['TOTAL DEL DÍA',ventaDia],[],
      ['COBROS'],...COBROS.map(([k,l])=>[l,sis.cobros[k]||0]),['Total cobrado',otrosSis],[],
      ['ARQUEO'],['Fondo inicial',fondo],['Ventas en efectivo',efectivoSis],
      ['Gastos',-gastos],['Propinas de tarjeta pagadas',-adelanto],['Efectivo del local',esperado],
      ['Contado',contado??''],['Diferencia',dif??''],[],
      ['GASTOS'],...(c.gastos||[]).map(x=>[x.n,x.m]),[],
      ['Propinas totales',propinaSis],['Observaciones',c.nota||'']];
    const csv=filas.map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
    a.download=`cuadre-${S.local}-${f}.csv`; a.click(); toast('Cuadre exportado');
  };
}

/* ================= impresión (render a imagen) =================
   El ticket se dibuja en un canvas del ancho exacto del cabezal
   (384 px = 58 mm, 576 px = 80 mm) y se imprime como imagen al 100 %
   del ancho de la página. Así el tamaño relativo es siempre el mismo,
   sin depender de la escala ni del tamaño de hoja del diálogo. */
const nPed = p => '#'+String(p.num).padStart(3,'0');
const anchoPx = () => S.impresora.papel===80 ? 576 : 384;

function estiloImpresion(){
  const im=S.impresora;
  let el=document.getElementById('printCss');
  if(!el){ el=document.createElement('style'); el.id='printCss'; document.head.appendChild(el); }
  const anchoPct = im.escala||100;
  const off = im.offsetPct||0;              // % del ancho: no se encoge con el escalado del driver
  const alin = im.alinear==='centro' ? '0 auto' : '0';
  el.textContent = `@page{margin:0}
    @media print{#print{width:${anchoPct}%;margin:${alin};transform:translateX(${off}%)}}`;
}
function envolver(ctx,txt,max){
  const out=[]; let linea='';
  String(txt).split(/\s+/).filter(Boolean).forEach(w=>{
    const t=linea?linea+' '+w:w;
    if(ctx.measureText(t).width<=max) linea=t;
    else { if(linea) out.push(linea); linea=w; }
  });
  if(linea) out.push(linea);
  return out.length?out:[''];
}
const fuenteDe = t => t==='comanda' ? (S.impresora.fuentePx||36) : (S.impresora.fuentePxBoleta||24);
async function cargarImg(src){
  // Con tope de espera: si el logo no carga, se imprime igual sin él
  return new Promise(ok=>{
    let listo=false;
    const fin=v=>{ if(!listo){ listo=true; ok(v); } };
    const i=new Image();
    i.onload=()=>fin(i); i.onerror=()=>fin(null);
    setTimeout(()=>fin(null),1500);
    i.src=src;
  });
}
function pintarCupon(bloques, fBase){
  const W=anchoPx(), pad=Math.round(W*0.02);
  // Colchón extra a la derecha: evita que la impresora coma los últimos dígitos del total.
  const padR = pad + Math.round(W*(S.impresora.margenDer??8)/100);
  const maxW = W - pad - padR;
  const f=fBase||S.impresora.fuentePx||34;
  const fnt=(s,b)=>`${b?'800':'600'} ${Math.round(s)}px Arial, Helvetica, sans-serif`;
  const med=document.createElement('canvas').getContext('2d');
  const lineas=[];
  bloques.forEach(b=>{
    if(b.t==='sellos'){
      const cols=Math.min(4,b.total), filas=Math.ceil(b.total/cols);
      const d=Math.round(Math.min(maxW/cols*0.8, f*2.8));
      const hFila=d+Math.round(f*0.95);
      lineas.push({t:'sellos',...b,cols,d,hFila,h:hFila*filas+Math.round(f*0.2)});
      return;
    }
    if(b.t==='hr'){ lineas.push({t:'hr',h:Math.round(f*0.75)}); return; }
    if(b.t==='gap'){ lineas.push({t:'gap',h:b.h||Math.round(f*0.45)}); return; }
    const size=b.size||f, bold=b.bold!==false, ind=b.indent||0;
    med.font=fnt(size,bold);
    if(b.t==='row'){
      const rw=med.measureText(b.r||'').width;
      const partes=envolver(med,b.l,Math.max(f*2, maxW-rw-Math.round(f*0.4)));
      partes.forEach((t,i)=> lineas.push({t:'row',l:t,r:i===partes.length-1?(b.r||''):'',size,bold,h:Math.round(size*1.4)}));
      return;
    }
    envolver(med,b.s,maxW-ind).forEach(t=>
      lineas.push({t:'txt',s:t,size,bold,align:b.align||'left',indent:ind,
        sub:!!b.sub,h:Math.round(size*(b.sub?1.75:1.4))}));
  });
  const avance=Math.round((S.impresora.avance||0)*(W/(S.impresora.papel===80?80:58)));
  const anchoLogo=Math.round(W*0.42);
  const altoLogo=(logoListo && S.impresora.logo!==false)
    ? Math.round(anchoLogo*logoListo.height/logoListo.width)+Math.round(f*0.3) : 0;
  const H=lineas.reduce((a,l)=>a+l.h,0)+pad*2+avance+altoLogo;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  c.fillStyle='#000'; c.textBaseline='top';
  let y=pad;
  if(logoListo && S.impresora.logo!==false){
    const w=Math.round(W*0.42), h=Math.round(w*logoListo.height/logoListo.width);
    c.drawImage(logoListo,(W-w)/2,y,w,h); y+=h+Math.round(f*0.3);
  }
  lineas.forEach(l=>{
    if(l.t==='sellos'){
      const paso=maxW/l.cols, r=l.d/2, gros=Math.max(3,Math.round(f*0.1));
      for(let i=0;i<l.total;i++){
        const cx=pad+paso*(i%l.cols)+paso/2, cy=y+Math.floor(i/l.cols)*l.hFila+r+2;
        const hito=(l.hitos||[]).find(h=>h.en===i+1);
        const lleno=i<l.llenos, regalo=(i===0&&l.cortesia), premio=(i===l.total-1);
        c.beginPath(); c.arc(cx,cy,r-gros/2,0,Math.PI*2); c.lineWidth=gros;
        if(lleno||regalo){ c.fillStyle='#000'; c.fill(); }
        else { c.setLineDash((premio||hito)?[]:[gros*1.6,gros*1.3]); c.strokeStyle='#000'; c.stroke(); c.setLineDash([]); }
        c.textAlign='center'; c.textBaseline='middle';
        c.fillStyle=(lleno||regalo)?'#fff':'#000';
        if(regalo){ c.font=fnt(l.d*0.62,true); c.fillText('★',cx,cy+l.d*0.03); }
        else if(lleno){ c.font=fnt(l.d*0.55,true); c.fillText('✓',cx,cy+l.d*0.02); }
        else if(premio){ c.font=fnt(l.d*0.2,true); c.fillText('PREMIO',cx,cy); }
        else if(hito){ c.font=fnt(l.d*0.19,true); c.fillText('REGALO',cx,cy); }
        else { c.font=fnt(l.d*0.4,false); c.fillText(String(i+1),cx,cy); }
        c.fillStyle='#000'; c.textBaseline='top';
        const et = regalo ? 'regalo' : (premio ? (lleno?'¡listo!':l.etFinal||'') : (hito ? (lleno?'¡listo!':hito.et) : ''));
        if(et){ c.font=fnt(f*0.65,true); c.fillText(et,cx,cy+r+Math.round(f*0.12)); }
      }
      c.textAlign='left'; y+=l.h; return;
    }
    if(l.t==='hr'){ c.fillRect(pad,y+Math.floor(l.h/2)-2,maxW,Math.max(2,Math.round(f*0.09))); y+=l.h; return; }
    if(l.t==='gap'){ y+=l.h; return; }
    c.font=fnt(l.size,l.bold);
    const yy=y+Math.round((l.h-l.size)*0.35);
    if(l.t==='row'){
      c.textAlign='left'; c.fillText(l.l,pad,yy);
      if(l.r){ c.textAlign='right'; c.fillText(l.r,W-padR,yy); }
    } else if(l.align==='center'){
      const cx=(pad+(W-padR))/2;
      c.textAlign='center'; c.fillText(l.s,cx,yy);
      if(l.sub){
        const an=c.measureText(l.s).width;
        c.fillRect(cx-an/2, yy+l.size*1.16, an, Math.max(2,Math.round(l.size*0.09)));
      }
    }
    else {
      c.textAlign='left'; c.fillText(l.s,pad+l.indent,yy);
      if(l.sub){
        const an=c.measureText(l.s).width;
        c.fillRect(pad+l.indent, yy+l.size*1.16, an, Math.max(2,Math.round(l.size*0.09)));
      }
    }
    y+=l.h;
  });
  return cv.toDataURL('image/png');
}
function destinoLineas(p){
  if(p.modo==='delivery') return ['DELIVERY',p.cliente||'Cliente',p.dir,p.fono].filter(Boolean);

  return ['PARA LLEVAR',p.cliente||'Cliente',p.fono].filter(Boolean);

function htmlCupon(bloques, tipo){
  const base=S.impresora.fuentePt||16;
  const pt = tipo==='comanda' ? base : Math.max(6, Math.round(base*(fuenteDe('boleta')/(S.impresora.fuentePx||36))));
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const filas=bloques.map(b=>{
    if(b.t==='sellos'){
      const marcas=Array.from({length:b.total},(_,i)=>{
        const h=(b.hitos||[]).find(h=>h.en===i+1);
        if(i===0&&b.cortesia) return '★';
        if(i<b.llenos) return '●';
        if(i===b.total-1) return '🎁';
        if(h) return '🍟';
        return '○';
      });
      return `<div style="text-align:center;font-size:1.7em;letter-spacing:.18em;line-height:1.35;margin:.2em 0">${marcas.slice(0,4).join(' ')}<br>${marcas.slice(4).join(' ')}</div>`;
    }
    if(b.t==='hr') return `<div style="border-top:2px dashed #000;margin:.45em 0"></div>`;
    if(b.t==='gap') return `<div style="height:.4em"></div>`;
    const rel=((b.size||36)/(tipo==='comanda'?fuenteDe('comanda'):fuenteDe('boleta'))).toFixed(2);
    const st=`font-size:${rel}em;font-weight:800;line-height:1.3;margin:.12em 0`;
    if(b.t==='row') return `<div style="${st};display:flex;justify-content:space-between;gap:.4em">
      <span>${esc(b.l)}</span><span style="white-space:nowrap">${esc(b.r||'')}</span></div>`;
    const al=b.align==='center'?'text-align:center;':'';
    if(b.sub) return `<div style="${st};${al}text-decoration:underline;text-underline-offset:3px">${esc(b.s)}</div>`;
    const ind=b.indent?`padding-left:${(b.indent/36).toFixed(2)}em;`:'';
    return `<div style="${st};${al}${ind}">${esc(b.s)}</div>`;
  }).join('');
  return `<div style="font-family:'Arial Narrow',Arial,sans-serif;color:#000;font-size:${pt}pt;
    font-weight:800;overflow-wrap:anywhere;width:100%">${filas}</div>`;
}

/* ---------- Tarjeta descargable (imagen, no ticket de rollo) ---------- */
function envolverCentro(ctx,txt,maxW){
  const out=[]; let linea='';
  String(txt||'').split(/\s+/).filter(Boolean).forEach(w=>{
    const t=linea?linea+' '+w:w;
    if(ctx.measureText(t).width<=maxW) linea=t;
    else { if(linea) out.push(linea); linea=w; }
  });
  if(linea) out.push(linea);
  return out.length?out:[''];
}
function datosTarjeta(tel){
  const F=cfgFidel(), loc=S.locales[S.local]||L(), c=cli()[tel]||{tel,nombre:'',movs:[]};
  const s=sellosDe(c), llenos=Math.min(s,F.meta), cortesia=tieneCortesia(c);
  const ciclo=cicloDe(c);
  const hitos=hitosF().map(h=>({en:h.en, et:cortoDe(hitoDe(tel,h.en,ciclo).n)}));
  const listos=premiosListos(c);
  const prox=proximoPremio(c);
  const estado = listos.length ? '¡Tienes listo: '+listos.map(x=>x.texto).join(' + ')+'!'
    : `Te falta${prox.falta>1?'n':''} ${prox.falta} para ${prox.texto.toLowerCase()} gratis`;
  return {negocio:loc.nombre, nombre:c.nombre||'', tel:fonoBonito(tel), meta:F.meta, llenos, cortesia, hitos,
    etFinal:cortoDe(F.premio), estado, sub:`${llenos} de ${F.meta} sellos`,
    reglas:[F.modo==='shawarma'?'Cada shawarma suma 1 sello':'Cada compra suma 1 sello',
      ...(cortesia?['★ El primer sello va por la casa']:[]),
      'Válido en el local, para llevar y delivery directo. No aplica en apps.']};
}
function dibujarTarjetaPNG(o, logoImg){
  const W=1080, padX=90;
  const med=document.createElement('canvas').getContext('2d');
  const F1='800 42px Arial', F2='600 30px Arial';
  med.font=F1; const lineasEstado=envolverCentro(med,o.estado,W-padX*2);
  med.font=F2; const lineasReglas=o.reglas.flatMap(r=>envolverCentro(med,r,W-padX*2-40));
  const logoH = logoImg ? Math.round(140*logoImg.height/logoImg.width) : 0;
  const bandH = 60+logoH+44+32+40;               // logo + nombre del negocio, con aire
  const cols=Math.min(5,o.meta), filas=Math.ceil(o.meta/cols);
  const cellW=(W-padX*2)/cols, r=Math.min(cellW*0.38, 90);
  const topeBanda=bandH;
  const gridY0 = topeBanda+230, gridH = filas*(r*2+66);
  const estadoY0 = gridY0+gridH+30, estadoH = lineasEstado.length*54+50;
  const reglasY0 = estadoY0+estadoH, reglasH = lineasReglas.length*40+50;
  const H = Math.round(reglasY0+reglasH+60);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#FBF7F0'; c.fillRect(0,0,W,H);
  c.fillStyle='#1E1B18'; c.fillRect(0,0,W,bandH);
  let y=60;
  if(logoImg){ c.drawImage(logoImg,(W-140)/2,y,140,logoH); y+=logoH+18; }
  c.fillStyle='#fff'; c.textAlign='center';
  c.font='800 36px Arial'; c.fillText(String(o.negocio||'').toUpperCase(), W/2, y+32);
  c.fillStyle='#1E1B18';
  c.font='800 58px Arial'; c.fillText('PASAPORTE', W/2, topeBanda+80);
  c.font='700 40px Arial'; c.fillText(o.nombre||'Cliente nuevo', W/2, topeBanda+140);
  c.fillStyle='#8A8578'; c.font=F2; c.fillText(o.tel, W/2, topeBanda+182);
  for(let i=0;i<o.meta;i++){
    const col=i%cols, fila=Math.floor(i/cols);
    const cx=padX+cellW*col+cellW/2, cy=gridY0+fila*(r*2+66)+r;
    const hito=o.hitos.find(h=>h.en===i+1);
    const lleno=i<o.llenos, cortesia=(i===0&&o.cortesia), final=(i===o.meta-1);
    c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.lineWidth=6;
    if(lleno||cortesia){ c.fillStyle='#D9622B'; c.fill(); }
    else { c.setLineDash((final||hito)?[]:[9,8]); c.strokeStyle='#C3C6BB'; c.stroke(); c.setLineDash([]); }
    c.fillStyle=(lleno||cortesia)?'#fff':'#1E1B18'; c.textAlign='center'; c.textBaseline='middle';
    if(cortesia){ c.font='700 '+Math.round(r*0.9)+'px Arial'; c.fillText('★',cx,cy+4); }
    else if(lleno){ c.font='700 '+Math.round(r*0.8)+'px Arial'; c.fillText('✓',cx,cy+2); }
    else if(final){ c.font='800 '+Math.round(r*0.32)+'px Arial'; c.fillText('PREMIO',cx,cy); }
    else if(hito){ c.font='800 '+Math.round(r*0.28)+'px Arial'; c.fillText('REGALO',cx,cy); }
    else { c.font='600 '+Math.round(r*0.6)+'px Arial'; c.fillText(String(i+1),cx,cy); }
    c.textBaseline='alphabetic';
    const et = cortesia?'regalo':(final?(lleno?'¡listo!':o.etFinal):(hito?(lleno?'¡listo!':hito.et):''));
    if(et){ c.fillStyle='#8A8578'; c.font='700 22px Arial'; c.fillText(et,cx,cy+r+32); }
  }
  c.textAlign='center';
  c.fillStyle='#1E1B18'; c.font=F1;
  let yy=estadoY0+40;
  lineasEstado.forEach(l=>{ c.fillText(l,W/2,yy); yy+=54; });
  c.strokeStyle='#E7E1D3'; c.lineWidth=2; c.beginPath();
  c.moveTo(padX,reglasY0-10); c.lineTo(W-padX,reglasY0-10); c.stroke();
  c.fillStyle='#8A8578'; c.font=F2; yy=reglasY0+30;
  lineasReglas.forEach(l=>{ c.fillText(l,W/2,yy); yy+=40; });
  return cv.toDataURL('image/png');
}

async function imprimir(p, tipo='boleta'){
  const im=S.impresora;
  const src=S.locales[p.local||S.local]?.logoBN;
  logoListo = (src && im.logo!==false) ? await cargarImg(src) : null;
  estiloImpresion();
  const lista = tipo==='ambas' ? ['comanda','boleta'] : [tipo];
  if(lista.includes('boleta') && debeCupon(p)) lista.push('pasaporte');
  let html='';
  lista.forEach(t=>{
    const copias = t==='comanda' ? (im.copiasComanda||1) : ((t==='transferencia'||t==='pasaporte') ? 1 : (im.copiasBoleta||1));
    const bl = t==='comanda' ? bloquesComanda(p)
             : t==='transferencia' ? bloquesTransferencia(p.local||S.local, p)
             : t==='pasaporte' ? bloquesPasaporte(p.pasaporte.tel, p.local||S.local, p)
             : bloquesBoleta(p);
    const cuerpo = im.modo==='texto' ? htmlCupon(bl,t) : `<img src="${pintarCupon(bl, fuenteDe(t))}">`;
    for(let i=0;i<copias;i++) html += `<div class="cupon">${cuerpo}</div>`;
  });
  const cont=$('#print');
  cont.innerHTML = html;
  // Sin esperar la carga, Chrome puede mandar la hoja en blanco.
  const imgs=[...cont.querySelectorAll('img')];
  await Promise.all(imgs.map(el=> el.complete ? Promise.resolve()
    : new Promise(r=>{ el.onload=r; el.onerror=r; setTimeout(r,1500); })));
  try{ window.print(); }
  catch(e){ toast('El navegador bloqueó la impresión: usa "Descargar imagen"'); }
}

let ctx=null;
function beep(){
  if(!sonido) return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.3);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.32);
  }catch(e){}
}
